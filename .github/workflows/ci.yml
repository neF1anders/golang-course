name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [task3, task4]
    defaults:
      run:
        working-directory: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract task number from branch name
        id: extract
        run: |
          BRANCH="${{ github.ref_name }}"
          TASK=$(echo "$BRANCH" | grep -oE 'task[0-9]+' || echo "")
          if [ -z "$TASK" ]; then
            echo "Branch name does not contain taskX pattern"
            exit 1
          fi
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.extract.outputs.task }}/repo-stat/go.mod
          cache: true
          cache-dependency-path: ${{ steps.extract.outputs.task }}/repo-stat/go.sum

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install tools
        run: make -C repo-stat tools

      - name: Check protobuf generation
        run: |
          make proto
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Unit
        run: make unit

integration:
  runs-on: ubuntu-latest
  needs: lint-and-unit
  steps:
    - uses: actions/checkout@v5

    - name: Extract task number from branch name
      id: extract
      run: |
        BRANCH="${{ github.ref_name }}"
        TASK=$(echo "$BRANCH" | grep -oE 'task[0-9]+' || echo "")
        if [ -z "$TASK" ]; then
          echo "Branch name does not contain taskX pattern"
          exit 1
        fi
        echo "task=$TASK" >> $GITHUB_OUTPUT

    - name: Integration tests
      run: make test
      working-directory: ${{ steps.extract.outputs.task }}/repo-stat
      env:
        CONTAINER_RUNTIME: docker
