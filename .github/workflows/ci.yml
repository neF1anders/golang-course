name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract task number from branch name
        id: extract
        run: |
          BRANCH="${{ github.ref_name }}"
          NUMBER=$(echo "$BRANCH" | grep -oE '[0-9]+' | head -1 || echo "")
          if [ -z "$NUMBER" ]; then
            echo "Branch name does not contain a number: $BRANCH"
            exit 1
          fi
          TASK="task$NUMBER"
          echo "Extracted task: $TASK (from branch $BRANCH)"
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.extract.outputs.task }}/repo-stat/go.mod
          cache: true
          cache-dependency-path: ${{ steps.extract.outputs.task }}/repo-stat/go.sum

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install tools
        run: make -C repo-stat tools
        working-directory: ${{ steps.extract.outputs.task }}

      - name: Check protobuf generation
        run: |
          make proto
          git diff --exit-code
        working-directory: ${{ steps.extract.outputs.task }}

      - name: Lint
        run: make lint
        working-directory: ${{ steps.extract.outputs.task }}

      - name: Unit
        run: make unit
        working-directory: ${{ steps.extract.outputs.task }}

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v5

      - name: Extract task number from branch name
        id: extract
        run: |
          BRANCH="${{ github.ref_name }}"
          NUMBER=$(echo "$BRANCH" | grep -oE '[0-9]+' | head -1 || echo "")
          if [ -z "$NUMBER" ]; then
            echo "Branch name does not contain a number: $BRANCH"
            exit 1
          fi
          TASK="task$NUMBER"
          echo "Extracted task: $TASK (from branch $BRANCH)"
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - name: Integration tests
        run: make test
        working-directory: ${{ steps.extract.outputs.task }}/repo-stat
        env:
          CONTAINER_RUNTIME: docker
