name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  TASK_NUMBER: 5

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set working directory
        id: paths
        run: |
          TASK="task${{ env.TASK_NUMBER }}"
          echo "Extracted task: $TASK"
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.paths.outputs.task }}/repo-stat/go.mod
          cache: true
          cache-dependency-path: ${{ steps.paths.outputs.task }}/repo-stat/go.sum

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install tools
        run: make -C repo-stat tools
        working-directory: ${{ steps.paths.outputs.task }}

      - name: Check protobuf generation
        run: |
          make proto
          git diff --exit-code
        working-directory: ${{ steps.paths.outputs.task }}

      - name: Lint
        run: make lint
        working-directory: ${{ steps.paths.outputs.task }}

      - name: Unit
        run: make unit
        working-directory: ${{ steps.paths.outputs.task }}

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v5

      - name: Set working directory
        id: paths
        run: |
          TASK="task${{ env.TASK_NUMBER }}"
          echo "Extracted task: $TASK"
          echo "task=$TASK" >> $GITHUB_OUTPUT

      - name: Integration tests
        run: make test
        working-directory: ${{ steps.paths.outputs.task }}/repo-stat
        env:
          CONTAINER_RUNTIME: docker
