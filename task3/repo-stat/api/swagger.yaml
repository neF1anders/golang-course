
info:
  title: Repo Stat API
  description: API для получения статистики репозиториев GitHub
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Локальный сервер (порт из конфига)

paths:
  /api/ping:
    get:
      summary: Проверка доступности сервиса
      description: Возвращает статус "OK" для проверки работоспособности
      operationId: ping
      tags:
        - Health
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/repositories/info:
    get:
      summary: Получить информацию о репозитории
      description: Возвращает статистику (звёзды, форки, коммиты и т.д.) для указанного GitHub-репозитория
      operationId: getRepoInfo
      tags:
        - Репозитории
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: Полный URL репозитория GitHub (например, https://github.com/octocat/Hello-World)
          example: https://github.com/octocat/Hello-World
      responses:
        '200':
          description: Информация о репозитории успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryInfo'
        '400':
          description: Не указан или некорректен параметр url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Репозиторий не найден
        '500':
          description: Внутренняя ошибка сервера

components:
  schemas:
    RepositoryInfo:
      type: object
      properties:
        name:
          type: string
          example: "Hello-World"
        owner:
          type: string
          example: "octocat"
        stars:
          type: integer
          example: 1024
        forks:
          type: integer
          example: 512
        open_issues:
          type: integer
          example: 12
        last_commit_date:
          type: string
          format: date-time
          example: "2025-03-30T10:00:00Z"
        contributors_count:
          type: integer
          example: 8
      required:
        - name
        - owner
        - stars
        - forks

    Error:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Missing required parameter: url"