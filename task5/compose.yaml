services:
  api:
    image: api:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.api
    container_name: api
    restart: unless-stopped
    ports:
      - 28080:8081
    volumes:
      - ./repo-stat/api/config/config.yaml:/config.yaml
    environment:
      - LISTEN_ADDRESS=:8081
      - SUBSCRIBER_ADDRESS=subscriber:8082
      - PROCESSOR_ADDRESS=processor:8083
    depends_on:
      - subscriber
      - processor

  subscriber:
    image: subscriber:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.subscriber
    container_name: subscriber
    restart: unless-stopped
    ports:
      - 28082:8082
    volumes:
      - ./repo-stat/subscriber/config/config.yaml:/config.yaml
    environment:
      - LISTEN_ADDRESS=:8082
      - API_ADDRESS=api:8081
  tests:
    image: tests:latest
    build:
      context: tests
    container_name: tests
    restart: "no"
    depends_on:
      - api
    entrypoint: ["true"]

  processor:
    image: processor:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.processor
    container_name: processor
    restart: unless-stopped
    ports:
      - 28083:8083
    volumes:
      - ./repo-stat/processor/config/config.yaml:/config.yaml
    environment:
      - LISTEN_ADDRESS=:8083
      - API_ADDRESS=api:8081
      - COLLECTOR_ADDRESS=collector:8084
    depends_on:
      - collector


  collector:
    image: collector:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.collector
    container_name: collector
    restart: unless-stopped
    ports:
      - 28084:8084
    volumes:
      - ./repo-stat/collector/config/config.yaml:/config.yaml
    environment:
      - LISTEN_ADDRESS=:8084
      - API_ADDRESS=api:8081
      - PROCESSOR_ADDRESS=processor:8083


  subscribe:
    image: subscribe:latest
    build:
      context: repo-stat
      dockerfile: Dockerfile.subscribe
    container_name: subscribe
    restart: unless-stopped
    ports:
      - 28085:8085
    volumes:
      - ./repo-stat/subscribe/config/config.yaml:/config.yaml
    environment:
      - LISTEN_ADDRESS=:8085
      - API_ADDRESS=api:8081
      - COLLECTOR_ADDRESS=collector:8084
    depends_on:
      - collector
      - api
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscriptions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscriptions"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: